      <path d="M 235,325
               C 210,310 145,260 140,195
               C 135,130 185,110 215,135
               C 230,148 235,168 235,168
               C 235,168 220,135 185,140
               C 155,145 160,190 180,225
               C 200,260 235,295 235,325 Z"
            fill="url(#tealGrad)" />

      <path d="M 235,325
               C 195,300 130,240 130,180
               C 130,120 180,95 220,125
               C 230,133 235,145 235,145
               C 235,145 228,122 215,112
               C 180,85 115,115 115,180
               C 115,250 185,315 235,335 Z"
            fill="url(#tealGrad)" />

      <circle cx="235" cy="148" r="14" fill="url(#tealGrad)" />

      <path d="M 235,185
               C 220,150 225,100 250,80
               C 270,110 260,155 235,185 Z"
            fill="url(#tealGrad)" />

      <path d="M 242,170
               C 255,135 285,105 320,110
               C 315,145 275,170 242,170 Z"
            fill="url(#greenGrad)" />

      <path d="M 238,210
               C 265,190 305,190 320,215
               C 290,235 255,225 238,210 Z"
            fill="url(#greenGrad)" />

      <path d="M 235,335
               C 285,315 330,260 330,200
               C 330,165 315,140 295,145
               C 310,155 315,180 310,210
               C 300,260 255,305 235,325 Z"
