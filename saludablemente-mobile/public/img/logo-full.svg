<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Saludablemente — Proyecto de Salud">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e6878" />
      <stop offset="50%" stop-color="#14899d" />
      <stop offset="100%" stop-color="#22babb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c7c4e" />
      <stop offset="60%" stop-color="#49a944" />
      <stop offset="100%" stop-color="#84c243" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0e4b52" flood-opacity="0.08" />
    </filter>
  </defs>

  <g transform="translate(40, 0)">
