      <path d="M 230,210
               C 200,200 175,215 170,235
               C 195,240 220,225 230,210 Z"
            fill="url(#tealGrad)" opacity="0.85" />
    </g>

    <g id="logo-text">
      <text x="365" y="215"
            font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="42"
            font-weight="800"
            letter-spacing="1.5"
            fill="#0e6878">SALUDABLE</text>

      <text x="365" y="260"
            font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="42"
            font-weight="800"
            letter-spacing="1.5"
            fill="#49a944">MENTE</text>

      <text x="368" y="295"
            font-family="'Open Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="18"
            font-weight="400"
            letter-spacing="1"
            fill="#64748b">Proyecto de Salud</text>
    </g>
