<p class="hint">Nueva contraseña para <strong>{{ email }}</strong> (mínimo 8 caracteres).</p>

<form [formGroup]="form" (ngSubmit)="guardar()">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <label tuiLabel class="field">
    Nueva contraseña
    <tui-textfield>
      <input tuiInput type="password" formControlName="nueva" maxlength="80" autocomplete="new-password" />
    </tui-textfield>
    <tui-error formControlName="nueva" />
  </label>

  <label tuiLabel class="field">
    Confirmar contraseña
    <tui-textfield>
      <input tuiInput type="password" formControlName="confirmar" maxlength="80" autocomplete="new-password" />
    </tui-textfield>
  </label>

  <div class="form-actions">
    <button tuiButton appearance="primary" size="m" type="submit" [loading]="guardando()">
      <tui-icon icon="@tui.key" />
      Cambiar
    </button>
    <button tuiButton appearance="outline" size="m" type="button" (click)="cancelar()">
      Cancelar
    </button>
  </div>
</form>
