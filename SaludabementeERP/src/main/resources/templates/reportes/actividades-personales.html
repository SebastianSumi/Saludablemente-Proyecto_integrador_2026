<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Actividades personales</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        h1 { font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        td, th { border: 1px solid #ccc; padding: 6px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Actividades personales</h1>
    <p>Rango: <span th:text="${desde}">-</span> a <span th:text="${hasta}">-</span></p>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Lugar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${actividades}">
                <td th:text="${a.nombre}">-</td>
                <td th:text="${a.fechaActividad}">-</td>
                <td th:text="${a.estado}">-</td>
                <td th:text="${a.lugar}">-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
