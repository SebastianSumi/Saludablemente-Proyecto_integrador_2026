<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Evaluaciones personales</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        h1 { font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        td, th { border: 1px solid #ccc; padding: 6px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Evaluaciones nutricionales personales</h1>
    <table>
        <thead>
            <tr>
                <th>Periodo</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>IMC</th>
                <th>Dx IMC</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${evaluaciones}">
                <td th:text="${e.idPeriodo}">-</td>
                <td th:text="${e.fechaEvaluacion}">-</td>
                <td th:text="${e.estadoEvaluacion}">-</td>
                <td th:text="${e.imc}">-</td>
                <td th:text="${e.dxImc}">-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
