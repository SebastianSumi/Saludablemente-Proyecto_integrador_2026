server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO
    upeu.edu.pe.Saludabemente: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

saludablemente:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    qr-salt: ${QR_SALT}
    jwt:
      secret: ${JWT_SECRET}
      ttl-minutos: ${JWT_TTL_MINUTOS:60}
  storage:
    r2:
      enabled: ${R2_ENABLED:true}
      account-id: ${R2_ACCOUNT_ID:}
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      bucket: ${R2_BUCKET:${R2_BUCKET_NAME:saludablemente-assets}}
      public-base-url: ${R2_PUBLIC_BASE_URL:${R2_PUBLIC_URL}}
      region: ${R2_REGION:auto}
