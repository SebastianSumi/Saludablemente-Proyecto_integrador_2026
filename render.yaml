services:
  - type: web
    name: saludablemente-erp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./SaludabementeERP/Dockerfile
    dockerContext: ./SaludabementeERP
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
      - key: DB_POOL_SIZE
        value: 5
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QR_SALT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: R2_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: saludablemente-assets
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_REGION
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
